[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = []
  included_files = []

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/membership/checkout"
  to = "/.netlify/functions/membership-checkout"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
